name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The default build has no native dependency; the `dvdcss` feature is
      # opt-in and needs libdvdcss, so CI builds it explicitly on Linux only.
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose
      - name: Install libdvdcss (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdvdcss-dev
      - name: Build with dvdcss (Linux)
        if: runner.os == 'Linux'
        run: cargo build --workspace --features dvdcss
