name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The default build has no native dependency; the `dvdcss` feature is
      # opt-in and needs libdvdcss, so CI builds it explicitly on Linux only.
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose
      - name: Install libdvdcss (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdvd-pkg
          # libdvd-pkg normally builds libdvdcss from an APT post-invoke hook,
          # which is deferred while the dpkg database is locked ("postponed
          # till after next APT operation"). Run its builder directly so the
          # library exists before the dvdcss build links against it.
          sudo /usr/lib/libdvd-pkg/b-i_libdvdcss.sh
          sudo ldconfig
          ldconfig -p | grep libdvdcss
      - name: Build with dvdcss (Linux)
        if: runner.os == 'Linux'
        run: cargo build --workspace --features dvdcss
