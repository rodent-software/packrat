name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: packrat-linux-x86_64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: packrat-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: packrat-macos-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: packrat-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # The default build has no native dependency; CSS support is opt-in and
      # only wired up on Linux, where libdvdcss is available.
      - name: Build (Linux, with dvdcss)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdvdcss-dev
          cargo build --release --target ${{ matrix.target }} --features dvdcss
      - name: Build (other)
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release packrat
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/packrat.exe -DestinationPath ${{ matrix.archive }}

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
