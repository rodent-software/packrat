[workspace]
resolver = "2"
members = ["crates/packrat-core", "crates/packrat-cli"]

[workspace.package]
version = "0.1.0-rc.3"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"
authors = ["packrat contributors"]
repository = "https://github.com/rodent-software/packrat"
homepage = "https://rodent-software.github.io/packrat/"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Small, dependency-free string-similarity metrics for metadata matching.
strsim = "0.11"
ureq = { version = "3", features = ["json"] }
ratatui = "0.29"
signal-hook = "0.3"
# Cross-platform free/total space on the destination volume.
fs4 = { version = "1", features = ["sync"] }
# Runtime loading of the user-supplied libdvdcss (never linked or bundled).
libloading = "0.8"

# Pure-Rust DVD-Video structure parsing (ISO9660/UDF, IFO/PGC, VOB demux, VobSub).
oxideav-dvd = "0.0.4"
# Pure-Rust Matroska reader/writer, codec-agnostic.
oxideav-mkv = "0.0.10"
# Shared media types (Packet / StreamInfo / CodecParameters) used by the muxer API.
oxideav-core = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
